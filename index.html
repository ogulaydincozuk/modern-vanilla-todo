<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iTask Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="profile">
                <div class="avatar">OÇ</div>
                <span>Oğul Aydın</span>
            </div>
            <nav>
                <div class="nav-item active">Odak</div>
                <div class="nav-item">Planlanmış</div>
                <div class="nav-item">Tamamlanan</div>
            </nav>
        </aside>
        
        <main class="dashboard">
            <header class="main-header">
                <h1>Bugün</h1>
                <p id="current-date"></p>
            </header>
            
            <div class="task-input-section">
                <input type="text" id="todo-input" placeholder="Yeni bir görev planla...">
                <button id="add-btn">+</button>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <span class="stat-value" id="pending-count">0</span>
                    <span class="stat-label">Bekleyen</span>
                </div>
                <div class="stat-card">
                    <span class="stat-value" id="completed-count">0</span>
                    <span class="stat-label">Biten</span>
                </div>
            </div>

            <ul id="todo-list" class="task-list"></ul>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
