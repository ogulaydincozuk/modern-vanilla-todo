<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iTask Midnight Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="brand">iTask Pro</div>
            <nav>
                <button class="filter-btn active" data-filter="all">Tümü</button>
                <button class="filter-btn" data-filter="pending">Bekleyenler</button>
                <button class="filter-btn" data-filter="completed">Bitenler</button>
            </nav>
            <div class="progress-section">
                <span class="progress-text">Verimlilik</span>
                <div class="progress-bar"><div id="progress-fill"></div></div>
            </div>
        </aside>
        
        <main class="dashboard">
            <header class="main-header">
                <h1>Gecen İyi Olsun, Oğul</h1>
                <p id="current-date"></p>
            </header>
            
            <div class="input-panel">
                <div class="input-row">
                    <input type="text" id="todo-input" placeholder="Görevi planla...">
                    <select id="category-input">
                        <option value="İş">İş</option>
                        <option value="Kişisel">Kişisel</option>
                        <option value="Acil">Acil</option>
                    </select>
                </div>
                <div class="input-row">
                    <input type="date" id="date-input">
                    <button id="add-btn">Ekle</button>
                </div>
            </div>

            <ul id="todo-list" class="task-list"></ul>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
